name = "openlistnextpro"
main = "src/backend/worker.ts"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"


[vars]
ENVIRONMENT = "production"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "admin"
VITE_API_URL = "/api"

[[kv_namespaces]]
binding = "OPENLISTNEXT_KV"
id = "9b0cd005547d49d596d3f0fc50029cf7"

[[routes]]
pattern = "list.tiouo.cc/*"
zone_name = "tiouo.cc"




